<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello from Flask</title>
  </head>
  <body>
    <!--This is a Jinja2 conditional. Flask uses Jinja2 to put Python logic inside HTML. -->

    {% if name %}
    <h1>Hello {{ name }}!</h1>
    {% else %}
    <h1>Hello World!</h1>
    {% endif %}
  </body>
</html>
