<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hellow file</title>
  </head>
  <body>
    {% if name %}
    <h1>hello {{name}}</h1>
    {% else % }
    <h1>hello , world</h1>
    <!--{% endif %} tells Jinja/Flask that an if block has ended.-->
    {% endif %}
  </body>
</html>
